manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

arm:
  # Analytical OPW solver for the 6R arm sub-chain (J1-J6, rail excluded).
  # See fanuc_gazebo/config/r2000_kinematics.yaml for the full derivation
  # notes. Verified to reproduce every tending_lib joint snapshot to
  # ~1e-6 m / 0 deg (scratchpad FK check).
  kinematics_solver: moveit_opw_kinematics_plugin/MoveItOPWKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  opw_tool_frame: opw_tool0
  opw_kinematics_geometric_parameters:
    a1: 0.312
    a2: -0.225
    b: 0.0
    c1: 0.67
    c2: 1.075
    c3: 1.73
    c4: 0.215
  opw_kinematics_joint_offsets: [0.0, 0.0, -1.5707963267948966, 0.0, 0.0, 0.0]
  opw_kinematics_joint_sign_corrections: [1, 1, -1, -1, -1, -1]
